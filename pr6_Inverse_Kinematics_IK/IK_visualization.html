<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PR6: 로봇 팔 역운동학(IK) 시뮬레이터</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; gap: 20px; margin-top: 20px; }
        canvas { background: #222; border: 2px solid #444; border-radius: 10px; cursor: crosshair; }
        .info-panel { width: 300px; background: #2c3e50; padding: 20px; border-radius: 10px; border-left: 8px solid #3498db; }
        .data-val { color: #f1c40f; font-weight: bold; font-family: monospace; font-size: 1.2em; }
        .status-ok { color: #2ecc71; }
        .status-err { color: #e74c3c; }
        kbd { background: #444; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
    </style>
</head>
<body>

    <h1> PR6: 로봇 팔 역운동학(IK) 제어</h1>
    <p>그래프 위를 클릭하거나 마우스를 움직여 <kbd>X, Y</kbd> 좌표를 지정하세요.</p>

    <div class="container">
        <canvas id="robotCanvas" width="500" height="500"></canvas>

        <div class="info-panel">
            <h3> 실시간 데이터</h3>
            <p>목표 좌표: <br>X: <span id="targetX" class="data-val">0</span>, Y: <span id="targetY" class="data-val">0</span></p>
            <hr>
            <p>어깨 각도 (&theta;1): <br><span id="angle1" class="data-val">0</span>°</p>
            <p>팔꿈치 각도 (&theta;2): <br><span id="angle2" class="data-val">0</span>°</p>
            <hr>
            <p>시스템 상태: <br><span id="status" class="status-ok">정상 작동 중</span></p>
            <small style="color: #888;">* CAN ID 0x200 송신 대기 중</small>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('robotCanvas');
        const ctx = canvas.getContext('2d');
        const L1 = 150; // 첫 번째 팔 길이
        const L2 = 120; // 두 번째 팔 길이
        const origin = { x: 250, y: 400 }; // 로봇 어깨 위치 (그래프 원점)

        function draw(targetX, targetY) {
            // 1. 역운동학(IK) 계산
            // 화면 좌표를 로봇 좌표로 변환
            const x = targetX - origin.x;
            const y = origin.y - targetY;

            const d2 = x*x + y*y;
            const d = Math.sqrt(d2);

            // 코사인 법칙: cos(theta2) = (x^2 + y^2 - L1^2 - L2^2) / (2 * L1 * L2)
            let cosTheta2 = (d2 - L1*L1 - L2*L2) / (2 * L1 * L2);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            if (cosTheta2 >= -1 && cosTheta2 <= 1) {
                const theta2 = Math.acos(cosTheta2);
                const theta1 = Math.atan2(y, x) - Math.atan2(L2 * Math.sin(theta2), L1 + L2 * Math.cos(theta2));

                // 관절 위치 계산
                const joint1 = {
                    x: origin.x + L1 * Math.cos(theta1),
                    y: origin.y - L1 * Math.sin(theta1)
                };
                const joint2 = { x: targetX, y: targetY };

                // 팔 그리기
                drawArm(origin, joint1, joint2);
                updateUI(x, y, theta1, theta2, true);
            } else {
                updateUI(x, y, 0, 0, false);
                // 닿지 않을 때 붉은 점 표시
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(targetX, targetY, 5, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawGrid() {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for(let i=0; i<500; i+=50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 500); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(500, i); ctx.stroke();
            }
            // 작업 반경 표시
            ctx.strokeStyle = '#444';
            ctx.beginPath(); ctx.arc(origin.x, origin.y, L1 + L2, 0, Math.PI*2); ctx.stroke();
        }

        function drawArm(p0, p1, p2) {
            ctx.lineCap = 'round';
            // 첫 번째 팔
            ctx.strokeStyle = '#3498db'; ctx.lineWidth = 12;
            ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
            // 두 번째 팔
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            // 관절 점
            ctx.fillStyle = 'white';
            [p0, p1, p2].forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();
            });
        }

        function updateUI(x, y, t1, t2, ok) {
            document.getElementById('targetX').innerText = Math.round(x);
            document.getElementById('targetY').innerText = Math.round(y);
            const status = document.getElementById('status');
            
            if (ok) {
                document.getElementById('angle1').innerText = (t1 * 180 / Math.PI).toFixed(1);
                document.getElementById('angle2').innerText = (t2 * 180 / Math.PI).toFixed(1);
                status.innerText = "정상 작동 중";
                status.className = "status-ok";
            } else {
                document.getElementById('angle1').innerText = "---";
                document.getElementById('angle2').innerText = "---";
                status.innerText = "⚠️ 도달 불가 지역!";
                status.className = "status-err";
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            draw(e.clientX - rect.left, e.clientY - rect.top);
        });

        drawGrid(); // 초기 화면
    </script>
</body>
</html>
