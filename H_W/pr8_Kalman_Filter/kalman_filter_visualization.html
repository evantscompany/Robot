<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalman Filter Sensor Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background: #0f172a; color: white; display: flex; height: 100vh; overflow: hidden; }
        
        /* 왼쪽 제어 패널 */
        .left-panel {
            width: 350px; background: #111827; border-right: 2px solid #1e293b;
            padding: 25px; display: flex; flex-direction: column; gap: 20px;
        }
        h1 { font-size: 22px; color: #38bdf8; margin-bottom: 10px; }
        .control-group { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        select {
            width: 100%; padding: 10px; background: #0f172a; color: #22d3ee;
            border: 1px solid #334155; border-radius: 6px; outline: none; cursor: pointer;
        }
        
        /* 상태 카드 */
        .status-card {
            background: #020617; padding: 15px; border-radius: 12px;
            border-left: 4px solid #38bdf8; line-height: 1.6;
        }
        .status-val { font-family: monospace; color: #f8fafc; font-size: 18px; }

        /* 오른쪽 캔버스 영역 */
        .canvas-wrapper { flex: 1; position: relative; background: #0b1220; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .guide {
            position: absolute; top: 20px; left: 20px;
            background: rgba(15, 23, 42, 0.85); padding: 15px;
            border-radius: 12px; border: 1px solid #334155; pointer-events: none;
        }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="left-panel">
    <h1>📡 Kalman Filter</h1>
    <p style="font-size: 13px; color: #64748b; margin-top:-15px;">센서 노이즈 제거 시뮬레이션</p>

    <div class="control-group">
        <label>🛠️ 센서 오차 (Measurement Error)</label>
        <select id="measError">
            <option value="0.1">낮음 (정밀 센서)</option>
            <option value="0.5" selected>보통 (일반 GPS)</option>
            <option value="2.0">높음 (노이즈 심함)</option>
            <option value="5.0">매우 높음 (불량 상태)</option>
        </select>
        <p style="font-size:11px; color:#64748b; margin-top:5px;">값이 클수록 센서가 지분거립니다.</p>
    </div>

    <div class="control-group">
        <label>🧠 예측 신뢰도 (Estimate Error)</label>
        <select id="estError">
            <option value="0.01">매우 신뢰 (부드러운 이동)</option>
            <option value="0.1" selected>보통</option>
            <option value="1.0">낮음 (센서에 의존함)</option>
        </select>
        <p style="font-size:11px; color:#64748b; margin-top:5px;">값이 작을수록 필터가 부드러워집니다.</p>
    </div>

    <div class="status-card">
        <label>현재 센서값 (Raw)</label>
        <div class="status-val" id="rawVal">0.00</div>
    </div>

    <div class="status-card" style="border-color: #22c55e;">
        <label>필터링 결과 (Kalman)</label>
        <div class="status-val" id="filteredVal" style="color:#22c55e;">0.00</div>
    </div>

    <div style="margin-top: auto; font-size: 12px; color: #475569; line-height: 1.4;">
        <strong>정비사님 팁:</strong><br>
        센서 오차를 '매우 높음'으로 두고,<br>
        신뢰도를 '매우 신뢰'로 설정해보세요.<br>
        노이즈를 얼마나 잘 깎는지 확인 가능합니다.
    </div>
</div>

<div class="canvas-wrapper">
    <div class="guide">
        <h2>실시간 데이터 트래킹</h2>
        <div class="legend-item"><div class="dot" style="background: #ef4444;"></div> 빨간선: 튀는 센서값 (Raw Data)</div>
        <div class="legend-item"><div class="dot" style="background: #22c55e;"></div> 초록선: 칼만 필터 결과 (Filtered)</div>
        <div class="legend-item"><div class="dot" style="background: rgba(255,255,255,0.2);"></div> 배경: 마우스 이동 경로 (True)</div>
    </div>
    <canvas id="canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    
    // 칼만 필터 클래스 (정비사님이 주신 코드 기반)
    class SimpleKalman {
        constructor() {
            this.estimate = 0.0;
            this.error_est = 1.0;
            this.error_meas = 0.5;
            this.last_estimate = 0.0;
        }

        update(measurement) {
            // 1. 칼만 이득 계산
            const kalman_gain = this.error_est / (this.error_est + this.error_meas);
            // 2. 최종 예측값 업데이트
            this.estimate = this.last_estimate + kalman_gain * (measurement - this.last_estimate);
            // 3. 예측 오차 업데이트
            this.error_est = (1.0 - kalman_gain) * this.error_est;
            this.last_estimate = this.estimate;
            return this.estimate;
        }
    }

    const kf = new SimpleKalman();
    let history = []; // 데이터 저장용
    let mouseX = 0;
    let mouseY = 0;
    let frameCount = 0; // 프레임 카운트 추가

    function resize() {
        canvas.width = window.innerWidth - 350;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 마우스 이동 시 '참값' 업데이트
    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX - 350;
        mouseY = e.clientY;
    });

    function animate() {
        frameCount++;
        
        // 3프레임에 한번씩만 업데이트 (속도 조절)
        if (frameCount % 3 !== 0) {
            requestAnimationFrame(animate);
            return;
        }
        
        ctx.fillStyle = "#0b1220";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. 설정값 실시간 반영
        kf.error_meas = parseFloat(document.getElementById("measError").value);
        kf.error_est = parseFloat(document.getElementById("estError").value);

        // 2. 가상의 노이즈 생성 (센서가 튀는 현상)
        const noise = (Math.random() - 0.5) * (kf.error_meas * 100);
        const rawY = mouseY + noise;

        // 3. 칼만 필터 적용
        const filteredY = kf.update(rawY);

        // UI 텍스트 업데이트
        document.getElementById("rawVal").innerText = rawY.toFixed(2);
        document.getElementById("filteredVal").innerText = filteredY.toFixed(2);

        // 4. 데이터 히스토리 관리
        history.push({ raw: rawY, filtered: filteredY, x: mouseX });
        if (history.length > 200) history.shift();

        // 5. 그래프 그리기
        // 배경 그리드
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        // Raw 데이터 (빨간색 - 지분거림)
        ctx.beginPath();
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 2]);
        history.forEach((d, i) => {
            const xPos = canvas.width - (history.length - i) * 5;
            if (i === 0) ctx.moveTo(xPos, d.raw);
            else ctx.lineTo(xPos, d.raw);
        });
        ctx.stroke();

        // Filtered 데이터 (초록색 - 부드러움)
        ctx.beginPath();
        ctx.strokeStyle = "#22c55e";
        ctx.lineWidth = 3;
        ctx.setLineDash([]);
        history.forEach((d, i) => {
            const xPos = canvas.width - (history.length - i) * 5;
            if (i === 0) ctx.moveTo(xPos, d.filtered);
            else ctx.lineTo(xPos, d.filtered);
        });
        ctx.stroke();

        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
